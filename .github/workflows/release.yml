name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=build-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "EtchForge ${{ steps.tag.outputs.tag }}" \
            --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, rid: win-x64 }
          - { name: macos-arm64, os: macos-latest, rid: osx-arm64 }
          - { name: linux-x64, os: ubuntu-latest, rid: linux-x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-macos.sh arm64 --self-contained
          name="EtchForge-${{ matrix.name }}"
          ditto -c -k --keepParent dist/${{ matrix.rid }}/EtchForge.app "$name.zip"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - name: Publish
        if: runner.os != 'macOS'
        shell: bash
        run: >
          dotnet publish EtchForge.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:UseAppHost=true -o publish
      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          name="EtchForge-${{ matrix.name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" ./publish/*
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" -C publish .
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" "$ASSET" --repo "${{ github.repository }}" --clobber
